services:
  - type: web
    name: rotacion-inventario
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /salud
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: TEAM_EMAILS
        sync: false
      # Opcional: manda el recordatorio de calendario también por correo (server/correo.js).
      - key: BREVO_API_KEY
        sync: false
      - key: CORREO_REMITENTE
        sync: false
      - key: APP_URL
        sync: false
      - key: LANDING_URL
        sync: false
