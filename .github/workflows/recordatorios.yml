# Una vez al día despierta el servidor de Render (plan gratis) y le pide mandar los avisos por
# correo que tocan hoy. Necesita los secretos APP_URL y CRON_SECRET del repositorio (ver README).
name: Recordatorios por correo

on:
  schedule:
    - cron: '0 12 * * *' # 7 a. m. en Colombia
  workflow_dispatch:

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - name: Pedir el envío de avisos
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # El primer intento puede tardar mientras Render despierta el servidor.
          curl --fail --silent --show-error --retry 3 --retry-delay 30 --retry-all-errors --max-time 120 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/tareas/recordatorios"
